# 采用JSON兼容的YAML格式；工作流内容可由标准库严格解析。
# Actions固定提交已核对；中文输出显式使用UTF-8，自托管运行器未注册。
{
  "name": "测试工程质量检查",
  "on": {
    "push": null,
    "pull_request": null,
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "offline-checks": {
      "runs-on": "windows-latest",
      "env": {"PYTHONUTF8": "1"},
      "steps": [
        {
          "name": "获取源码",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "准备Python",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "安装固定依赖",
          "run": "python -m pip install -r requirements.txt"
        },
        {
          "name": "检查源码和套件清单",
          "run": "python 工程检查.py"
        },
        {
          "name": "执行离线检查",
          "run": "python -m pytest checks --junitxml=runs/ci/结果.xml"
        },
        {
          "name": "保存离线检查结果",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "离线工程检查结果",
            "path": "runs/ci/结果.xml",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
